name: "FFmpeg Video (30fps) - Windows"
description: "Create MP4 video from stacked images at 30 frames per second (JPG/JPEG)"
command: "Get-ChildItem -Filter *.jpg,*.JPG,*.jpeg,*.JPEG | Sort-Object Name | ForEach-Object { \"file '$($_.Name)'\" } | Out-File -FilePath files.txt -Encoding ASCII; ffmpeg -f concat -safe 0 -i files.txt -r 30 -c:v libx264 -pix_fmt yuv420p -crf 23 -y output.mp4; Remove-Item files.txt"
working_directory: "output"
env_vars: {}
os: "windows"
